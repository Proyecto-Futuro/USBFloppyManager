name: CI y release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y dosfstools mtools python3-tk xvfb
      - run: pip install ".[test]"
      - run: pytest -q

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv libfuse2
      - name: Compilar AppImage (con el Python del sistema, que trae tkinter)
        run: |
          /usr/bin/python3 -m venv .venv
          . .venv/bin/activate
          pip install . pyinstaller
          ./packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: USBFloppyManager-*.AppImage }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: python build_pyinstaller.py
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/appimage/*.AppImage
            artifacts/windows/*.exe
