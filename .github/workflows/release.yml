name: CI y release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # botón «Run workflow» en la pestaña Actions

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y dosfstools mtools python3-tk xvfb
      - run: pip install ".[test]"
      - run: pytest -q

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv libfuse2
      - name: Compilar AppImage (con el Python del sistema, que trae tkinter)
        run: |
          /usr/bin/python3 -m venv .venv
          . .venv/bin/activate
          pip install . pyinstaller
          ./packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: USBFloppyManager-*.AppImage }

  cli-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - name: Binario de la CLI (sin GUI)
        run: python -m PyInstaller --noconfirm --clean --onefile --name usbfloppy-linux-x86_64 --collect-all pyfatfs --collect-all fs --exclude-module tkinter usbfloppy.py
      - run: ./dist/usbfloppy-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with: { name: cli-linux, path: dist/usbfloppy-linux-x86_64 }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: python build_pyinstaller.py
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  release:
    # Publica vX.Y.Z (X.Y.Z = __version__) si esa versión todavía no tiene release.
    # Para lanzar una versión nueva: sube __version__ en usbfloppymanager/__init__.py y haz push a main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [appimage, cli-linux, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión y comprobar si ya existe la release
        id: ver
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.*)\"', open('usbfloppymanager/__init__.py').read()).group(1))")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          echo "Versión: v$V"
      - if: steps.ver.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with: { path: artifacts }
      - if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/appimage/*.AppImage
            artifacts/cli-linux/usbfloppy-linux-x86_64
            artifacts/windows/*.exe
      - if: steps.ver.outputs.exists == 'true'
        run: echo "La release ${{ steps.ver.outputs.tag }} ya existe; no se publica nada. Sube __version__ para una nueva."
